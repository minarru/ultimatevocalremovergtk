name: Release check

on:
  push:
    tags:
      - "v*"

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce main dev-doc boundary
        run: python3 scripts/dev_docs_policy.py check

      - name: Verify tag matches VERSION and release.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(grep "^VERSION" __version__.py | cut -d"'" -f2)"
          JSON_VERSION="$(python3 -c "import json; print(json.load(open('packaging/release.json'))['latest_version'])")"
          BUNDLED_VERSION="$(python3 -c "import json; print(json.load(open('bundled/release.json'))['latest_version'])")"
          echo "Tag: ${TAG}"
          echo "VERSION: ${VERSION}"
          echo "packaging/release.json: ${JSON_VERSION}"
          echo "bundled/release.json: ${BUNDLED_VERSION}"
          test "${TAG}" = "${VERSION}"
          test "${TAG}" = "${JSON_VERSION}"
          test "${TAG}" = "${BUNDLED_VERSION}"

      - name: Install system dependencies
        timeout-minutes: 4
        run: |
          # Azure is often black-holed (Ign after connect timeout). The
          # mirrorlist then fails over to https://archive.ubuntu.com, which
          # connects but stalls mid-InRelease — apt's Timeout only covers
          # connect, so the previous step sat until the 5m cap.
          # Pin HTTP Canonical. Prefer the image's pre-populated lists so a
          # healthy run never fetches InRelease. python3/pip/venv are already
          # on the image.
          printf '%s\n' \
            'APT::Acquire::Retries "1";' \
            'Acquire::http::Timeout "15";' \
            'Acquire::ForceIPv4 "true";' \
            | sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
          printf '%s\n' 'http://archive.ubuntu.com/ubuntu/' \
            | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|' \
            /etc/apt/sources.list.d/ubuntu.sources
          pkgs=(python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 ffmpeg rubberband-cli xvfb)
          if ! sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${pkgs[@]}"; then
            sudo apt-get update \
              -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" \
              -o Dir::Etc::sourceparts="-" \
              -o APT::Get::List-Cleanup="0"
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${pkgs[@]}"
          fi

      - name: Create virtual environment
        run: |
          # Match install_packages.sh: system GTK/gi via python3-gi.
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run unit tests
        env:
          GSK_RENDERER: cairo
        run: xvfb-run -a .venv/bin/python -m unittest discover -s tests -v
