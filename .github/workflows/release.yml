name: Release check

on:
  push:
    tags:
      - "v*"

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches VERSION and release.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(grep "^VERSION" __version__.py | cut -d"'" -f2)"
          JSON_VERSION="$(python3 -c "import json; print(json.load(open('packaging/release.json'))['latest_version'])")"
          BUNDLED_VERSION="$(python3 -c "import json; print(json.load(open('bundled/release.json'))['latest_version'])")"
          echo "Tag: ${TAG}"
          echo "VERSION: ${VERSION}"
          echo "packaging/release.json: ${JSON_VERSION}"
          echo "bundled/release.json: ${BUNDLED_VERSION}"
          test "${TAG}" = "${VERSION}"
          test "${TAG}" = "${JSON_VERSION}"
          test "${TAG}" = "${BUNDLED_VERSION}"

      - name: Install system dependencies
        timeout-minutes: 5
        run: |
          # GHA ubuntu-24.04 apt-mirrors.txt tries Azure first, then
          # https://archive.ubuntu.com. A stalled InRelease fetch can sit
          # for minutes with the default 120s timeouts and no step cap.
          # python3/pip/venv are already on the image.
          printf '%s\n' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "20";' \
            'Acquire::https::Timeout "20";' \
            'Acquire::ForceIPv4 "true";' \
            | sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
          sudo apt-get update \
            -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" \
            -o Dir::Etc::sourceparts="-" \
            -o APT::Get::List-Cleanup="0"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3-gi \
            gir1.2-gtk-4.0 gir1.2-adw-1 \
            ffmpeg rubberband-cli xvfb

      - name: Create virtual environment
        run: |
          # Match install_packages.sh: system GTK/gi via python3-gi.
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run unit tests
        env:
          GSK_RENDERER: cairo
        run: xvfb-run -a .venv/bin/python -m unittest discover -s tests -v
