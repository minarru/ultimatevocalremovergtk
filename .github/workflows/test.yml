          print("Adw", Adw.get_major_version(), Adw.get_minor_version(), Adw.get_micro_version())
          assert sys.version_info[:2] == (3, 14)
          assert sys.base_prefix == "/usr"
          assert gi.__file__.startswith("/usr/lib/python3/dist-packages/")
          PYTHON

      - name: Run isolated X11 display smoke and unit tests
        run: |
          env -u DISPLAY -u WAYLAND_DISPLAY -u DBUS_SESSION_BUS_ADDRESS \
