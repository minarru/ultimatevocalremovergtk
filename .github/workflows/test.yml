          import gi
          gi.require_version("Gtk", "4.0")
          from gi.repository import Gtk, Gdk
          Gtk.init()
          display = Gdk.Display.get_default()
          assert display is not None
          print("CI display:", type(display).__name__, display.get_name())
          assert display.__gtype__.name == "GdkX11Display"
          PYTHON
              .venv/bin/python -m unittest discover -s tests -t . -v
            '

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Create virtual environment
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt
          # Separate, --no-deps: see requirements-stubs.txt.
          .venv/bin/pip install --no-deps -r requirements-stubs.txt

      - name: Run basedpyright
        run: .venv/bin/python -m basedpyright
