required-version = "==0.16.6"
target-version = "py312"
line-length = 100
include = ["*.py", "*.pyi"]
extend-exclude = ["models", "vendor/demucs"]
force-exclude = true

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "RUF100"]

[lint.per-file-ignores]
# Legacy wildcard constants; keep exceptions limited to existing consumers.
"core/model_config/config.py" = ["F403", "F405"]
"core/model_data.py" = ["F403", "F405"]
"core/model_repository.py" = ["F403", "F405"]
"engines/base.py" = ["F403", "F405"]
"engines/demucs_engine.py" = ["F403", "F405"]
"engines/mdx.py" = ["F403", "F405"]
"engines/mdx_c.py" = ["F403", "F405"]
"engines/mdx_c_engine.py" = ["F403", "F405"]
"engines/orchestration.py" = ["F403", "F405"]
"engines/vr.py" = ["F403", "F405"]

[format]
quote-style = "preserve"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = false
