  - vocals
  - instrumental
  patience: 30
  reduce_factor: 0.85
  target_instrument: vocals
  num_epochs: 1000
  num_steps: 210
  q: 0.95
  coarse_loss_clip: true
  ema_momentum: 0.999
  optimizer: prodigy
  lr: 1.0
  other_fix: false
  use_amp: true
  
augmentations:
  enable: true
  loudness: true
  loudness_min: 0.75
  loudness_max: 1.0
 
  all:
    random_inverse: 0.1
    random_polarity: 0.5
    channel_shuffle: 0.5
    seven_band_parametric_eq: 0.5
    seven_band_parametric_eq_min_gain_db: -6
    seven_band_parametric_eq_max_gain_db: 0
    mp3_compression: 0.1
    mp3_compression_min_bitrate: 96
    mp3_compression_max_bitrate: 320
    mp3_compression_backend: "lameenc"
    pedalboard_distortion: 0.01
    pedalboard_distortion_drive_db_min: 1.0
    pedalboard_distortion_drive_db_max: 6.0
    pedalboard_bitcrash: 0.01
    pedalboard_bitcrash_bit_depth_min: 4
    pedalboard_bitcrash_bit_depth_max: 16

loss_multistft:
  fft_sizes: [1024, 2048, 4096]
  hop_sizes: [512, 1024, 2048]
  win_lengths: [1024, 2048, 4096]
  window: "hann_window"
  scale: "mel"
  n_bins: 128
  sample_rate: 44100
  perceptual_weighting: false
  w_sc: 0.0
  w_log_mag: 1.0
  w_lin_mag: 0.0
  w_phs: 0.0
  mag_distance: "L1"

inference:
  batch_size: 1
  dim_t: 2001
  num_overlap: 2
  normalize: false
